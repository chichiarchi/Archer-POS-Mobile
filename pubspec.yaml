name: archer_pos
description: Archer POS - Point of Sale System for Android phones and tablets
publish_to: 'none'
version: 2.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  sqflite: ^2.3.3
  path_provider: ^2.1.3
  path: ^1.9.0
  intl: ^0.19.0
  provider: ^6.1.2
  shared_preferences: ^2.2.3
  crypto: ^3.0.3
  flutter_slidable: ^3.1.1
  fl_chart: ^0.69.0
  google_fonts: ^6.2.1
  permission_handler: ^11.3.1
  image_picker: ^1.1.2
  file_picker: ^8.1.3
  csv: ^6.0.0
  pdf: ^3.11.1
  printing: ^5.13.1
  share_plus: ^10.0.2
  uuid: ^4.4.2
  collection: ^1.18.0
  flutter_staggered_animations: ^1.1.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  flutter_launcher_icons: ^0.13.1

flutter_launcher_icons:
  android: "launcher_icon"
  ios: false
  image_path: "archer_logo.png"

flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - assets/icons/
